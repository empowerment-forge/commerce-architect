name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
  workflow_dispatch:

env:
  BACKEND_IMAGE: ghcr.io/empowerment-forge/commerce-architect-backend
  FRONTEND_IMAGE: ghcr.io/empowerment-forge/commerce-architect-frontend

jobs:
  frontend-image-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build frontend image once
        run: docker build --tag "${FRONTEND_IMAGE}:${GITHUB_SHA}" frontend

      - name: Start controlled API target
        run: |
          docker network create commerce-frontend-ci
          docker run --detach \
            --name commerce-frontend-api \
            --network commerce-frontend-ci \
            --network-alias backend-smoke \
            hashicorp/http-echo:1.0 \
            -listen=:8081 \
            -text=commerce-api-proxy-ok

      - name: Validate exact frontend image
        run: |
          image="${FRONTEND_IMAGE}:${GITHUB_SHA}"
          docker run --rm \
            --network commerce-frontend-ci \
            --env PORT=8080 \
            --env BACKEND_HOST=backend-smoke \
            --env BACKEND_PORT=8081 \
            "${image}" nginx -t

          docker run --detach \
            --name commerce-frontend-app \
            --network commerce-frontend-ci \
            --publish 8080:8080 \
            --env PORT=8080 \
            --env BACKEND_HOST=backend-smoke \
            --env BACKEND_PORT=8081 \
            "${image}"

          for _ in {1..30}; do
            status=$(curl --silent --show-error \
              --output /tmp/frontend-index.html \
              --write-out '%{http_code}' \
              --header 'X-Forwarded-Proto: https' \
              http://127.0.0.1:8080/) || status=000
            if [ "${status}" = "200" ]; then
              break
            fi
            sleep 2
          done
          test "${status}" = "200"
          grep --fixed-strings '<div id="root"></div>' /tmp/frontend-index.html

          status=$(curl --silent --show-error \
            --output /tmp/frontend-spa-route.html \
            --write-out '%{http_code}' \
            http://127.0.0.1:8080/client-side-route)
          test "${status}" = "200"
          grep --fixed-strings '<div id="root"></div>' \
            /tmp/frontend-spa-route.html

          for path in /.git/config /.env; do
            status=$(curl --silent --show-error \
              --output /tmp/frontend-sensitive-response \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080${path}")
            test "${status}" = "404"
            if grep --quiet --fixed-strings '<div id="root"></div>' \
              /tmp/frontend-sensitive-response; then
              echo "Sensitive path returned the React index: ${path}"
              exit 1
            fi
          done

          for prefix in api admin static; do
            headers="/tmp/frontend-${prefix}-redirect-headers"
            status=$(curl --silent --show-error \
              --output /dev/null \
              --dump-header "${headers}" \
              --write-out '%{http_code}' \
              --header 'Host: dev-commerce.empowerment-forge.com' \
              --header 'X-Forwarded-Proto: https' \
              "http://127.0.0.1:8080/${prefix}")
            test "${status}" = "308"
            location=$(awk 'tolower($1) == "location:" {
              sub(/\r$/, "", $2); print $2
            }' "${headers}")
            test "${location}" = "/${prefix}/"
            if [[ "${location}" == http://* \
              || "${location}" == *:8080* \
              || "${location}" == *backend-smoke* ]]; then
              echo "Unsafe bare-prefix redirect: /${prefix}"
              cat "${headers}"
              exit 1
            fi
          done

          curl --fail --silent --show-error \
            --header 'Host: dev-commerce.empowerment-forge.com' \
            --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8080/api/ \
            | grep --fixed-strings 'commerce-api-proxy-ok'

          curl --fail --silent --show-error \
            --header 'Host: dev-commerce.empowerment-forge.com' \
            --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8080/admin/ \
            | grep --fixed-strings 'commerce-api-proxy-ok'

          curl --fail --silent --show-error \
            --header 'Host: dev-commerce.empowerment-forge.com' \
            --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8080/static/ \
            | grep --fixed-strings 'commerce-api-proxy-ok'

          curl --fail --silent --show-error \
            --header 'Host: dev-commerce.empowerment-forge.com' \
            --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8080/static/admin/css/base.css \
            | grep --fixed-strings 'commerce-api-proxy-ok'

      - name: Scan exact frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Export validated frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          docker save "${FRONTEND_IMAGE}:${GITHUB_SHA}" \
            | gzip > frontend-image.tar.gz

      - name: Upload validated frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-image-${{ github.sha }}
          path: frontend-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  backend-image-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build backend image once
        run: docker build --tag "${BACKEND_IMAGE}:${GITHUB_SHA}" backend

      - name: Start CI PostgreSQL
        run: |
          docker network create commerce-backend-ci
          docker run --detach \
            --name commerce-backend-postgres \
            --network commerce-backend-ci \
            --env POSTGRES_DB=commerce_ci \
            --env POSTGRES_USER=commerce_ci \
            --env POSTGRES_PASSWORD=ci-only-password \
            postgres:16-alpine
          for _ in {1..30}; do
            if docker exec commerce-backend-postgres \
              pg_isready --username commerce_ci --dbname commerce_ci; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready within 60 seconds."
          exit 1

      - name: Validate exact backend image
        env:
          CI_SECRET_KEY: ci-only-strong-secret-key-with-more-than-fifty-characters-123456789
        run: |
          image="${BACKEND_IMAGE}:${GITHUB_SHA}"
          runtime_environment=(
            --network commerce-backend-ci
            --env COMMERCE_ENV=production
            --env DJANGO_SECRET_KEY="${CI_SECRET_KEY}"
            --env DJANGO_DEBUG=false
            --env "DJANGO_ALLOWED_HOSTS=healthcheck.railway.app,localhost,testserver"
            --env DJANGO_CSRF_TRUSTED_ORIGINS=https://localhost
            --env DJANGO_TRUST_FORWARDED_PROTO=true
            --env DJANGO_SECURE_SSL_REDIRECT=false
            --env AUTH_FRONTEND_BASE_URL=https://commerce.example
            --env EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
            --env "DEFAULT_FROM_EMAIL=Commerce Architect <noreply@commerce.example>"
            --env SMTP_HOST=smtp.example.com
            --env SMTP_PORT=587
            --env SMTP_USERNAME=ci-smtp-user
            --env SMTP_PASSWORD=ci-only-smtp-password
            --env SMTP_USE_TLS=true
            --env SMTP_USE_SSL=false
            --env SMTP_TIMEOUT=10
            --env DATABASE_HOST=commerce-backend-postgres
            --env DATABASE_NAME=commerce_ci
            --env DATABASE_USER=commerce_ci
            --env DATABASE_PASSWORD=ci-only-password
            --env DATABASE_PORT=5432
          )

          docker run --rm "${runtime_environment[@]}" "${image}" pytest
          docker run --rm "${runtime_environment[@]}" \
            "${image}" python manage.py check
          docker run --rm "${runtime_environment[@]}" \
            --env DJANGO_SECURE_SSL_REDIRECT=true \
            "${image}" python manage.py check --deploy
          docker run --rm "${runtime_environment[@]}" \
            "${image}" python manage.py migrate --noinput

          docker run --detach \
            --name commerce-backend-app \
            --publish 8000:8000 \
            --env PORT=8000 \
            "${runtime_environment[@]}" \
            --env DJANGO_SECURE_SSL_REDIRECT=true \
            "${image}"

          healthy=false
          for _ in {1..30}; do
            if response=$(curl --fail --silent --show-error \
              --header 'Host: healthcheck.railway.app' \
              --header 'X-Forwarded-Proto: https' \
              http://127.0.0.1:8000/health/); then
              test "$(jq -r '.status' <<<"${response}")" = "ok"
              test "$(jq -r '.database' <<<"${response}")" = "ok"
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "${healthy}" != true ]; then
            docker logs commerce-backend-app
            exit 1
          fi
          test "$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            --header 'Host: healthcheck.railway.app' \
            --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8000/admin/)" = "302"
          curl --fail --silent --show-error \
            --header 'Host: healthcheck.railway.app' \
            --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8000/static/admin/css/base.css \
            >/dev/null

      - name: Scan exact backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Export validated backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          docker save "${BACKEND_IMAGE}:${GITHUB_SHA}" \
            | gzip > backend-image.tar.gz

      - name: Upload validated backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7
        with:
          name: backend-image-${{ github.sha }}
          path: backend-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  test:
    if: always()
    needs:
      - frontend-image-validation
      - backend-image-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Require all validation jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend-image-validation.result }}
          BACKEND_RESULT: ${{ needs.backend-image-validation.result }}
        run: |
          test "${FRONTEND_RESULT}" = "success"
          test "${BACKEND_RESULT}" = "success"

  publish-and-deploy-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      - test
    runs-on: ubuntu-latest
    concurrency:
      group: commerce-architect-backend-development
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download validated backend image
        uses: actions/download-artifact@v8
        with:
          name: backend-image-${{ github.sha }}

      - name: Load validated backend image
        run: gunzip --stdout backend-image.tar.gz | docker load

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable commit tag
        run: docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"

      - name: Resolve published image digest
        id: image
        run: |
          digest=$(docker buildx imagetools inspect \
            "${BACKEND_IMAGE}:${GITHUB_SHA}" \
            --format '{{.Manifest.Digest}}')
          case "${digest}" in
            sha256:*) ;;
            *) echo "Unable to resolve the published image digest."; exit 1 ;;
          esac
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Deploying ${BACKEND_IMAGE}:${GITHUB_SHA} (${digest})"

      - name: Deploy exact image digest to Railway development
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          jq --null-input \
            --arg image "${BACKEND_IMAGE}@${IMAGE_DIGEST}" \
            '{services: {"93c267b7-e8cd-49c4-be9b-abe34aaa4373": {source: {image: $image}}}}' \
          | npx --yes @railway/cli@5.37.4 environment edit \
            --project 3ee1b9eb-3197-4b93-9ddd-de9e3f09c433 \
            --environment development \
            --message "Deploy backend ${GITHUB_SHA}" \
            --json

      - name: Require successful Railway deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          expected_image="${BACKEND_IMAGE}@${IMAGE_DIGEST}"
          for _ in {1..60}; do
            deployments=$(npx --yes @railway/cli@5.37.4 deployment list \
              --project 3ee1b9eb-3197-4b93-9ddd-de9e3f09c433 \
              --environment development \
              --service backend \
              --limit 10 \
              --json)
            status=$(jq --raw-output --arg image "${expected_image}" \
              '[.[] | select(.meta.image == $image)][0].status // "NOT_FOUND"' \
              <<<"${deployments}")
            case "${status}" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|NEEDS_APPROVAL|SLEEPING|SKIPPED|REMOVED|REMOVING)
                echo "Railway deployment reached terminal status: ${status}"
                exit 1
                ;;
              NOT_FOUND|QUEUED|INITIALIZING|WAITING|BUILDING|DEPLOYING) sleep 10 ;;
              *) echo "Unexpected Railway deployment status: ${status}"; exit 1 ;;
            esac
          done
          echo "Railway deployment did not complete within 10 minutes."
          exit 1

  publish-and-deploy-frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      - test
    runs-on: ubuntu-latest
    concurrency:
      group: commerce-architect-frontend-development
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download validated frontend image
        uses: actions/download-artifact@v8
        with:
          name: frontend-image-${{ github.sha }}

      - name: Load validated frontend image
        run: gunzip --stdout frontend-image.tar.gz | docker load

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable frontend commit tag
        run: docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"

      - name: Resolve published frontend image digest
        id: image
        run: |
          digest=$(docker buildx imagetools inspect \
            "${FRONTEND_IMAGE}:${GITHUB_SHA}" \
            --format '{{.Manifest.Digest}}')
          case "${digest}" in
            sha256:*) ;;
            *) echo "Unable to resolve the published frontend image digest."; exit 1 ;;
          esac
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Deploying ${FRONTEND_IMAGE}:${GITHUB_SHA} (${digest})"

      - name: Deploy exact frontend image digest to Railway development
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          jq --null-input \
            --arg image "${FRONTEND_IMAGE}@${IMAGE_DIGEST}" \
            '{services: {"430aa8c4-88a5-4b7f-b433-9c0a3ff6e642": {source: {image: $image}}}}' \
          | npx --yes @railway/cli@5.37.4 environment edit \
            --project 3ee1b9eb-3197-4b93-9ddd-de9e3f09c433 \
            --environment development \
            --message "Deploy frontend ${GITHUB_SHA}" \
            --json

      - name: Require successful Railway frontend deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          expected_image="${FRONTEND_IMAGE}@${IMAGE_DIGEST}"
          for _ in {1..60}; do
            deployments=$(npx --yes @railway/cli@5.37.4 deployment list \
              --project 3ee1b9eb-3197-4b93-9ddd-de9e3f09c433 \
              --environment development \
              --service frontend \
              --limit 10 \
              --json)
            status=$(jq --raw-output --arg image "${expected_image}" \
              '[.[] | select(.meta.image == $image)][0].status // "NOT_FOUND"' \
              <<<"${deployments}")
            case "${status}" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|NEEDS_APPROVAL|SLEEPING|SKIPPED|REMOVED|REMOVING)
                echo "Railway frontend deployment reached terminal status: ${status}"
                exit 1
                ;;
              NOT_FOUND|QUEUED|INITIALIZING|WAITING|BUILDING|DEPLOYING) sleep 10 ;;
              *) echo "Unexpected Railway frontend deployment status: ${status}"; exit 1 ;;
            esac
          done
          echo "Railway frontend deployment did not complete within 10 minutes."
          exit 1
