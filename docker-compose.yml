
services:
  db:
    image: docker.io/library/postgres:16
    container_name: commerce_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commercepass}
      POSTGRES_DB: ${POSTGRES_DB:-commerce_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: ./backend
    container_name: commerce_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      COMMERCE_ENV: development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-development-only-not-for-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],web,testserver}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      AUTH_REQUIRE_VERIFIED_EMAIL: ${AUTH_REQUIRE_VERIFIED_EMAIL:-true}
      AUTH_EMAIL_VERIFICATION_TTL_SECONDS: ${AUTH_EMAIL_VERIFICATION_TTL_SECONDS:-86400}
      AUTH_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${AUTH_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      AUTH_FRONTEND_BASE_URL: ${AUTH_FRONTEND_BASE_URL:-http://localhost:5173}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-accounts.mail.ReadableConsoleEmailBackend}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Commerce Architect <noreply@localhost>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
      DATABASE_HOST: db
      DATABASE_NAME: ${POSTGRES_DB:-commerce_db}
      DATABASE_USER: ${POSTGRES_USER:-commerce}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-commercepass}
      DATABASE_PORT: "5432"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: commerce_frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --force"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://web:8000}

volumes:
  postgres_data:
  frontend_node_modules:
