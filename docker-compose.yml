
services:
  db:
    image: docker.io/library/postgres:16
    container_name: commerce_db
    restart: always
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commercepass
      POSTGRES_DB: commerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: ./backend
    container_name: commerce_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: commerce_db
      DATABASE_USER: commerce
      DATABASE_PASSWORD: commercepass

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: commerce_frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web
    environment:
      VITE_API_PROXY_TARGET: http://web:8000

volumes:
  postgres_data:
  frontend_node_modules:
